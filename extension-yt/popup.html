<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      padding: 14px;
      font-family: system-ui, sans-serif;
      margin: 0;
      box-sizing: border-box;
    }
    h4 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f0f0f0;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #e4e4e4;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    #status {
      font-size: 12px;
      color: #666;
      min-height: 16px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h4>Descargar YouTube</h4>
  <button id="btn-mp3">Descargar MP3</button>
  <button id="btn-mp4">Descargar MP4</button>
  <div id="status">Listo</div>

  <script src="popup.js"></script>
</body>
</html>
